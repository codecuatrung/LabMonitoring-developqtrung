<div class="d-flex flex-wrap align-items-center justify-content-between gap-2 lm-pagination">
  <div class="d-flex align-items-center gap-2 small text-muted">
    <span>Hiển thị</span>
    <select
      class="form-select form-select-sm w-auto"
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
    >
      @for (size of pageSizeOptions; track size) {
        <option [ngValue]="size">{{ size }}</option>
      }
    </select>
    <span>bản ghi/trang — {{ totalCount }} bản ghi</span>
  </div>

  <div class="btn-group btn-group-sm" role="group">
    <button class="btn btn-outline-secondary" type="button" [disabled]="page <= 1" (click)="goTo(page - 1)">
      <i class="bi bi-chevron-left"></i>
    </button>
    @for (p of pageNumbers(); track $index) {
      @if (p === -1) {
        <button class="btn btn-outline-secondary" type="button" disabled>…</button>
      } @else {
        <button
          class="btn"
          [class.btn-primary]="p === page"
          [class.btn-outline-secondary]="p !== page"
          type="button"
          (click)="goTo(p)"
        >
          {{ p }}
        </button>
      }
    }
    <button class="btn btn-outline-secondary" type="button" [disabled]="page >= totalPages()" (click)="goTo(page + 1)">
      <i class="bi bi-chevron-right"></i>
    </button>
  </div>
</div>
