# Web admin entry point. HTTPS is REQUIRED: browsers only expose crypto.subtle (needed for the SSO
# Authorization-Code + PKCE login) and getDisplayMedia (screen presentation) on secure origins.
# Certificate/key are mounted from deploy/certs (see docs/DEPLOY.md).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # Someone typed http://host:4300 (plain HTTP on the TLS port) -> send them to https on the same port.
    # 4300 is the published host port in deploy/docker-compose.prod.yml.
    error_page 497 =301 https://$host:4300$request_uri;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Agent package upload (auto-update zip) and file-transfer push uploads (up to 500 MB) — the API caps them as well.
    client_max_body_size 600m;

    location /api/ {
        proxy_pass http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # SignalR (WebSocket): long-lived, needs the Upgrade headers and a long read timeout.
    location /hubs/ {
        proxy_pass http://api:5200;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # Angular routes -> index.html (hashed asset files are cached long-term).
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|woff2?|svg|png|jpg|ico)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
