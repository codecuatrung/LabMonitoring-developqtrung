# Production stack for Lab Monitoring on a single Linux Docker host (e.g. 192.168.1.28).
#
#   cp deploy/.env.prod.example deploy/.env      # then edit: DB_* (external SQL Server), SERVER_HOST
#   ./deploy/gen-cert.sh                          # self-signed cert for https://<SERVER_HOST>
#   docker compose -f deploy/docker-compose.prod.yml --env-file deploy/.env up -d --build
#
# Full walkthrough (SSO client setup, agent install, backups): docs/DEPLOY.md
#
# Ports published to the LAN:
#   4300 web admin (HTTPS, nginx) - open https://<SERVER_HOST>:4300/
#   5200 API over plain HTTP - used by the Agents on the lab PCs (they do not use SSO)
# SQL Server is NOT in this stack: it runs natively on another host (DB_HOST, e.g. 192.168.1.168).
# Redis and Seq are reachable only on the internal compose network / localhost.
name: labmonitoring

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--appendonly", "no"]
    environment:
      TZ: Asia/Ho_Chi_Minh
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  seq:
    image: datalust/seq:latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_NOAUTHENTICATION: "true"   # bound to 127.0.0.1 only; enable auth before exposing it
      TZ: Asia/Ho_Chi_Minh
    ports:
      - "127.0.0.1:5341:80"
    volumes:
      - seq-data:/data

  # One-shot: applies EF Core migrations (creates/updates the LabMonitoring database) then exits.
  migrate:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: labmonitoring-api:latest
    command: ["seed"]
    restart: "no"
    environment: &api-env
      TZ: Asia/Ho_Chi_Minh
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__SqlServer: "Server=${DB_HOST},${DB_PORT:-1433};Database=${DB_NAME:-LabMonitoring};User Id=${DB_USER};Password=${DB_PASSWORD};TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: redis:6379
      Keycloak__Authority: ${SSO_AUTHORITY:-https://sso2.huph.edu.vn/realms/coreproject}
      Keycloak__InternalAuthority: ${SSO_AUTHORITY:-https://sso2.huph.edu.vn/realms/coreproject}
      Keycloak__Audience: labmonitoring-api
      Keycloak__RequireHttpsMetadata: "true"
      Cors__AllowedOrigins__0: https://${SERVER_HOST}:4300
      Auth__BootstrapAdmins__0: ${BOOTSTRAP_ADMIN}
      Serilog__WriteTo__1__Args__serverUrl: http://seq:80

  api:
    image: labmonitoring-api:latest
    restart: unless-stopped
    ports:
      - "5200:5200"     # Agents talk to the API directly over HTTP
    environment: *api-env
    volumes:
      # AgentSecret Data Protection keys - losing this makes every registered agent's secret unreadable.
      - api-dp-keys:/var/lib/labmonitoring-api/dp-keys
      # Uploaded Agent update packages (auto-update).
      - api-agent-packages:/var/lib/labmonitoring-api/agent-packages
      # Files pushed to clients and zips collected from them (file transfer); cleaned by the retention job.
      - api-file-transfers:/var/lib/labmonitoring-api/file-transfers
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:5200/health/live"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    image: labmonitoring-web:latest
    restart: unless-stopped
    ports:
      - "4300:443"     # web admin over HTTPS on 4300 (nginx listens on 443 inside the container)
    volumes:
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      api:
        condition: service_healthy

volumes:
  redis-data:
  seq-data:
  api-dp-keys:
  api-agent-packages:
  api-file-transfers:
