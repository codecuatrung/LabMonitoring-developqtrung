name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      # Integration tests boot the real Program.cs, which migrates the schema at startup — they
      # need an actual reachable SQL Server, not a mock. This container only lives for the job.
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: "CiOnly_Passw0rd!"
        ports:
          - 1433:1433
        options: >-
          --health-cmd="/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'CiOnly_Passw0rd!' -C -Q 'SELECT 1'"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
      # SignalR's Redis backplane (RealtimeExtensions.cs) throws synchronously out of any handler
      # that publishes a group message once Redis is configured but unreachable — degrades gracefully
      # only when no Redis connection string is set at all, not on a live connection failure. Same
      # container the local dev stack (deploy/docker-compose.dev.yml) already runs.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      ConnectionStrings__SqlServer: "Server=localhost,1433;Database=LabMonitoring;User Id=sa;Password=CiOnly_Passw0rd!;TrustServerCertificate=True;Encrypt=True;MultipleActiveResultSets=True"
      ConnectionStrings__Redis: "localhost:6379"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: backend/global.json
      - run: dotnet restore LabMonitoring.Backend.slnx
      - run: dotnet build LabMonitoring.Backend.slnx -c Release --no-restore
      - run: dotnet test LabMonitoring.Backend.slnx -c Release --no-build --verbosity normal

  agent:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: agent/global.json
      - run: dotnet restore LabMonitoring.Agent.slnx
      - run: dotnet build LabMonitoring.Agent.slnx -c Release --no-restore
      - run: dotnet test LabMonitoring.Agent.slnx -c Release --no-build --verbosity normal
      - run: dotnet publish src/LabMonitoring.Agent/LabMonitoring.Agent.csproj -c Release -r win-x64 --self-contained -o artifacts/agent
      - uses: actions/upload-artifact@v4
        with:
          name: labagent-win-x64
          path: agent/artifacts/agent

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build -- --configuration development
